<svg width="160" height="50" viewBox="0 0 160 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- magnifier drop‐shadow -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- text drop‐shadow -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- magnifying‐glass outline in orange with its shadow -->
  <g filter="url(#glassShadow)">
    <circle
      cx="80" cy="25" r="18"
      stroke="#ff6b35" stroke-width="6"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line
      x1="92" y1="37" x2="108" y2="53"
      stroke="#ff6b35" stroke-width="6"
      stroke-linecap="round"
    />
  </g>

  <!-- grouped letters inside the lens with shadows -->
  <text
    font-family="Arial, sans-serif"
    font-weight="bold"
    font-size="20"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#textShadow)"
  >
    <tspan x="62" y="25" fill="#135e96">S</tspan>
    <tspan x="82" y="25" fill="#ff6b35">A</tspan>
    <tspan x="102" y="25" fill="#efefd0">W</tspan>
    <tspan x="122" y="25" fill="#135e96">P</tspan>
  </text>
</svg>
